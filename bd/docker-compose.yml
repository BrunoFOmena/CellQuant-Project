# Postgres local via Docker — caminho padrão de desenvolvimento.
# Produção (Docker vs Postgres instalado vs serviço gerenciado) ainda está em aberto.
#
# Uso:
#   cd bd
#   docker compose up -d
#
# Schema + seed mock só na PRIMEIRA criação do volume.
# Subidas seguintes NÃO apagam exames.
#
# Se o Postgres instalado no Windows estiver na porta 5432, pare o serviço antes:
#   Stop-Service postgresql-x64-16
services:
  postgres:
    image: postgres:16-alpine
    container_name: contador_lcr_db
    environment:
      POSTGRES_USER: lcr
      POSTGRES_PASSWORD: lcr123
      POSTGRES_DB: contador_lcr
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcr -d contador_lcr"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    profiles: ["test"]
    image: postgres:16-alpine
    container_name: contador_lcr_db_test
    environment:
      POSTGRES_USER: lcr
      POSTGRES_PASSWORD: lcr123
      POSTGRES_DB: contador_lcr_test
    ports:
      - "5433:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcr -d contador_lcr_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  pgdata_test:
