name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature
      - fix
      - hotfix
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop
      - feature
      - fix
      - hotfix

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lcr
          POSTGRES_PASSWORD: lcr123
          POSTGRES_DB: contador_lcr_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lcr -d contador_lcr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Job único para exigir na proteção da main. Falha se backend ou frontend falhou.
  ci:
    name: CI
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir testes verdes
        run: |
          echo "backend=${{ needs.backend.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "CI recusou o merge/publish: backend ou frontend falhou."
            exit 1
          fi

  e2e:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [ci]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lcr
          POSTGRES_PASSWORD: lcr123
          POSTGRES_DB: contador_lcr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lcr -d contador_lcr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Schema do banco
        env:
          PGPASSWORD: lcr123
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U lcr -d contador_lcr -f bd/schema.sql
      - name: Backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://lcr:lcr123@127.0.0.1:5432/contador_lcr
        run: |
          pip install -r requirements.txt
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/ && break
            sleep 1
          done
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

  publish:
    # always() + checagem explícita: job skipped no needs NÃO publica.
    if: ${{ always() && needs.ci.result == 'success' && needs.e2e.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/brunofomena/contador-lcr-backend:latest
            ghcr.io/brunofomena/contador-lcr-backend:${{ github.sha }}
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ghcr.io/brunofomena/contador-lcr-frontend:latest
            ghcr.io/brunofomena/contador-lcr-frontend:${{ github.sha }}
