# Stack de laboratório (sem seed mock).
# Uso:
#   copy .env.prod.example .env
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# App: http://localhost
# Não exponha na internet — não há autenticação.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lcr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: contador_lcr
    volumes:
      - ./bd/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcr -d contador_lcr"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/brunofomena/contador-lcr-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+psycopg2://lcr:${POSTGRES_PASSWORD}@postgres:5432/contador_lcr
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/brunofomena/contador-lcr-frontend:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata_prod:
